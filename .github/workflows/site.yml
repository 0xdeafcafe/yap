name: site

# Publishes site/www to GitHub Pages at yap.forbes.red (site/www/CNAME).
on:
  push:
    branches: [main]
    paths: ["site/www/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/www
      - id: deployment
        uses: actions/deploy-pages@v4
