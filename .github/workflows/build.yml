name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: ./bundle.sh
      - run: Yap.app/Contents/MacOS/Yap --selftest

  # Push a tag like v0.2 (matching CFBundleShortVersionString) to sign, notarise and publish it.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-26
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches Info.plist
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME but Info.plist says $version"; exit 1; }

      - name: Signing keychain
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          keychain=$RUNNER_TEMP/yap.keychain-db
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials yap --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain"
          rm "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/notary.p8"

      - name: Build, notarise and publish
        env:
          YAP_NOTARY_PROFILE: yap
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          ./release.sh
          gh release create "$GITHUB_REF_NAME" Yap.zip appcast.xml --title "$GITHUB_REF_NAME" --generate-notes

      - name: Point the cask at it
        run: |
          cp Casks/yap.rb "$RUNNER_TEMP/yap.rb"
          git checkout -- .
          git fetch origin main && git checkout main
          cp "$RUNNER_TEMP/yap.rb" Casks/yap.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(cask): $GITHUB_REF_NAME" && git push origin main
