<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0c0a09; }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(1400px 900px at 50% 45%, #1d1814 0%, #0c0a09 60%, #070605 100%); }
  .abs { position: absolute; left: 0; top: 0; will-change: transform; }
  #world { position: absolute; inset: 0; }
  .ring { position: absolute; border-radius: 50%; border: 2px solid #f6ead4; }
  #glow { position: absolute; width: 900px; height: 900px; border-radius: 50%;
          background: radial-gradient(circle, rgba(229,55,31,.22), rgba(229,55,31,0) 65%); }
  svg#goo { position: absolute; left: 0; top: 0; overflow: visible; }
  #keylabel { color: #f6ead4; font-weight: 600; font-size: 64px; letter-spacing: -1px; text-align: center; }
  #keylabel small { display: block; font-size: 22px; font-weight: 500; opacity: .55; letter-spacing: 0; margin-top: 2px; }
  #transcript { color: #fff; font-weight: 450; line-height: 1.32; letter-spacing: -.2px; }
  #transcript span.w { display: inline-block; white-space: pre; }
  #transcript .cur { display: inline-block; width: 3px; background: #fff; vertical-align: -0.16em; margin: 0 2px 0 1px; height: 1.05em; }
  #transcript .hint { color: #8b8b8b; }
  #chiplabel { color: #fff; font-weight: 600; font-size: 28px; display: flex; align-items: center; gap: 10px; }
  #caption { left: 120px; top: 948px; height: 80px; overflow: hidden; color: #f6ead4; font-size: 54px; font-weight: 700; letter-spacing: -1.5px; white-space: nowrap; }
  #caption .idx { font-family: "SF Mono", Menlo, monospace; font-size: 20px; font-weight: 500; color: #e5371f; letter-spacing: 1px; margin-right: 22px; vertical-align: 16px; }
  #caption .inner { display: inline-block; }
  #win { width: 1200px; height: 470px; border-radius: 22px; background: #f8f5ef; box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); overflow: hidden; }
  #win .bar { height: 54px; display: flex; align-items: center; gap: 10px; padding-left: 22px; border-bottom: 1px solid #e6dfd3; }
  #win .bar i { width: 14px; height: 14px; border-radius: 50%; display: block; }
  #win .bar b { margin-left: 18px; font-weight: 600; font-size: 17px; color: #6d655b; }
  #win .row { padding: 16px 40px; border-bottom: 1px solid #ece6db; color: #9a9184; font-size: 21px; }
  #win .row em { color: #2a2520; font-style: normal; }
  #win .body { padding: 30px 40px; font-size: 29px; line-height: 1.42; color: #1f1b17; position: relative; }
  #pasted { position: relative; }
  #hl { position: absolute; inset: -4px -8px; background: #ffd9a8; border-radius: 6px; z-index: -1; }
  #caret { display: inline-block; width: 3px; height: 1.1em; background: #e5371f; vertical-align: -0.2em; }
  #stats { width: 1920px; height: 1080px; }
  .stat { position: absolute; left: 330px; }
  .stat .lbl { font-size: 30px; font-weight: 600; color: #a39a8e; margin-bottom: 14px; }
  .stat .bar { height: 74px; border-radius: 37px; }
  .stat .val { position: absolute; top: 44px; font-size: 64px; font-weight: 750; letter-spacing: -2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #statsTitle { position: absolute; left: 330px; top: 250px; font-family: "SF Mono", Menlo, monospace; color: #e5371f; font-size: 22px; letter-spacing: 3px; }
  .slam { position: absolute; width: 1920px; text-align: center; font-size: 190px; font-weight: 800; letter-spacing: -8px; color: #f6ead4; line-height: 1; }
  .slam u { text-decoration: none; position: relative; }
  .slam u::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 14px; background: #e5371f; transform-origin: left; transform: scaleX(var(--s, 0)); border-radius: 7px; }
  #wipe { position: absolute; inset: 0; background: #f6ead4; }
  #end { position: absolute; inset: 0; }
  #icon { width: 360px; height: 360px; }
  #word { width: 1920px; text-align: center; font-size: 190px; font-weight: 800; letter-spacing: -9px; color: #1c1612; line-height: 1; }
  #word span { display: inline-block; }
  #tag { width: 1920px; text-align: center; font-size: 36px; font-weight: 500; color: #6e6256; letter-spacing: -.3px; }
  #brew { font-family: "SF Mono", Menlo, monospace; font-size: 26px; color: #f6ead4; background: #1c1612; padding: 16px 28px; border-radius: 16px; white-space: pre; }
  #brew .p { color: #e5371f; }
  #grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; opacity: .22; }
</style>
</head>

  <path d="M145 140 C162 131 185 122 207 118 C191 124 186 128 185 139 C169 140 164 148 165 164 L150 170 C145 160 143 150 145 140Z" fill="url(#yt-gloss)"/>
  <path d="M115 160 Q119 150 131 146 C122 158 122 174 125 185 L117 190 Q111 173 115 160Z" fill="url(#yt-gloss)" opacity=".8"/>
  <path d="M284 105 Q297 104 303 110 C308 120 309 131 313 144 L299 145 C297 129 296 115 284 105Z" fill="url(#yt-gloss)" opacity=".64"/>
  <path d="M321 110 Q325 114 328 128 L333 143" fill="none" stroke="#ffc09a" stroke-width="2" stroke-linecap="round" opacity=".42"/>
  <path d="M153 136 C195 118 253 107 286 106" fill="none" stroke="#fff3d8" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>
</g>

<!-- Fixed hinge cheek and recessed axle cover the moving jaw's rear edge. -->
<path d="M110 202 C98 202 97 217 101 235 C104 248 111 259 118 257 C130 253 130 234 125 219 C122 209 117 202 110 202Z" fill="url(#yt-red)" stroke="#a52618" stroke-width=".8"/>
<path d="M107 207 C102 210 104 229 108 238" fill="none" stroke="url(#yt-gloss)" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="111" cy="219" rx="6.8" ry="12.3" transform="rotate(-13 111 219)" fill="#73150e"/>
<ellipse cx="111" cy="218" rx="4.2" ry="9" transform="rotate(-13 111 218)" fill="url(#yt-shaft)"/>
<path d="M109 212 L112 222" fill="none" stroke="#f1e2ca" stroke-width="1.3" opacity=".65"/>
</svg>

  <div id="wipe"></div>
  <div id="end">
    <img id="icon" class="abs" src="../icon/icon-1024.png">
    <div id="word" class="abs"><span>y</span><span>a</span><span>p</span></div>
    <div id="tag" class="abs">dictation for macos. hold fn, talk, let go.</div>
    <div id="brew" class="abs"></div>
  </div>

  <svg id="grain" width="1920" height="1080"><filter id="n"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="1"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.2"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>

<script>
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const inCubic = x => x * x * x;
const outCubic = x => 1 - Math.pow(1 - x, 3);
const outBack = (x, s = 1.8) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
// Damped spring from 0 to 1, settles by x=1.
const spring = (x, f = 1.6, d = 5.5) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-d * x) * Math.cos(2 * Math.PI * f * x);
const T = (el, x, y, s = 1, extra = '') => el.style.transform = `translate(${x}px,${y}px) scale(${s}) ${extra}`;
const setRect = (el, cx, cy, w, h, r) => {
  w = Math.max(0, w); h = Math.max(0, h);
  el.setAttribute('x', cx - w / 2); el.setAttribute('y', cy - h / 2);
  el.setAttribute('width', w); el.setAttribute('height', h);
  el.setAttribute('rx', Math.min(r, w / 2, h / 2));
};
const vis = (el, o) => { el.style.opacity = o; el.style.visibility = o <= 0.001 ? 'hidden' : 'visible'; };
const level = t => clamp(.5 + .28 * Math.sin(t * 13.1) + .2 * Math.sin(t * 29.3 + 1) + .14 * Math.sin(t * 47.7 + 2));

// Transcript, word by word.
const SAID = "hi shanice, hope you're well. just flagging, with love, that your mouth is moving a lot like a rodent. yapa, yapa, yapa, yapa, yapa. so, as per my last email, shush it, please. kind regards.";
const words = SAID.split(' ');
const tr = $('#transcript');
const spans = words.map((w, i) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w + ' '; tr.appendChild(s); return s; });
const cur = document.createElement('span'); cur.className = 'cur'; tr.appendChild(cur);
const hint = document.createElement('span'); hint.className = 'hint'; hint.textContent = ' — let go to paste'; tr.appendChild(hint);
const W0 = 2.75, W1 = 6.85;
let acc = 0; const dur = words.map(w => .5 + w.length * .12); const total = dur.reduce((a, b) => a + b);
const appear = dur.map(d => { const a = W0 + acc / total * (W1 - W0); acc += d; return a; });
$('#ptext').textContent = SAID;

// Rings.
const rings = [...Array(6)].map(() => { const d = document.createElement('div'); d.className = 'ring'; $('#rings').appendChild(d); return d; });

const PCX = 960, ORB_Y = 350, PW = 1100;
let panelH = 140;

function caption(t) {
  const caps = [[0.35, 2.15, '01', 'hold fn'], [2.55, 7.05, '02', 'talk'], [7.25, 9.35, '03', 'let go']];
  const el = $('#caption .inner');
  let y = 90, txt = '', idx = '';
  for (const [a, b, i, s] of caps) if (t >= a && t < b + .4) {
    txt = s; idx = i;
    y = t < b ? 90 * (1 - outExpo(prog(t, a, a + .55))) : -90 * inCubic(prog(t, b, b + .35));
  }
  el.querySelector('.idx').textContent = idx; el.querySelector('.txt').textContent = txt;
  el.style.transform = `translateY(${y}px)`;
}

function render(t, frame) {
  $('#turb').setAttribute('seed', frame % 9);
  caption(t);

  // ——— Scene 1–3 world: key → orb → panel → chip → window.
  const key = $('#key'), panel = $('#panel'), chip = $('#chip');
  const worldY = -400 * inOut(prog(t, 7.6, 8.35));
  const worldOut = prog(t, 9.3, 9.75);
  $('#world').style.transform = `translateY(${worldY}px) scale(${1 - .12 * inOut(worldOut)})`;
  $('#world').style.filter = worldOut > 0 ? `blur(${worldOut * 14}px)` : 'none';
  vis($('#world'), 1 - worldOut);

  // Key: pops in, gets held, then becomes the orb.
  const pop = spring(prog(t, 0.05, 0.9), 1.3, 5);
  const press = t < 0.65 ? 0 : t < 0.78 ? outCubic(prog(t, .65, .78)) : 1;
  const toOrb = inOut(prog(t, 1.7, 2.3));
  const lv = level(t) * prog(t, 2.6, 2.9) * (1 - prog(t, 6.95, 7.2));
  const orbBob = lv * 10;
  let kSize = lerp(220, 76, toOrb) * pop * (1 - .06 * press * (1 - toOrb));
  let kcx = PCX, kcy = lerp(500, ORB_Y, toOrb) + lerp(press * 8, 0, toOrb) - orbBob;
  // Orb retracts into the panel when you let go.
  const retract = inOut(prog(t, 7.15, 7.5));
  kcy = lerp(kcy, ORB_Y + 70, retract); kSize *= 1 - retract;
  setRect(key, kcx, kcy, kSize, kSize * (1 - .04 * press * (1 - toOrb)), lerp(48, 38, toOrb));
  const kl = $('#keylabel');
  T(kl, kcx - 110, kcy - 46 + press * 3, 1, `scale(${pop * (1 - toOrb)})`); kl.style.width = '220px';
  vis(kl, 1 - prog(t, 1.7, 2.0));
  const oi = $('#orbicon');
  T(oi, kcx - 22, kcy - 18, 1, `scale(${prog(t, 2.0, 2.3) * (1 - retract)})`);
  vis(oi, prog(t, 2.05, 2.3) * (1 - retract));
  $('#oiTop').setAttribute('transform', `rotate(${-lv * 18 * (0.5 - 0.5 * Math.cos(t * 2 * Math.PI * 6))} 4 16)`);

  // Panel grows out of the orb.
  const grow = prog(t, 2.05, 2.95);
  const gx = spring(grow, 1.1, 5.2), gy = spring(prog(t, 2.0, 2.8), 1.2, 5);
  // Transcript first, so the panel can wrap around its measured height.
  const fontSize = lerp(46, 35, inOut(prog(t, 4.8, 6.6)));
  tr.style.fontSize = fontSize + 'px';
  tr.style.width = (PW - 100) + 'px';
  let shown = 0;
  spans.forEach((s, i) => {
    const a = appear[i], p = prog(t, a, a + .28);
    s.style.display = t >= a ? 'inline-block' : 'none';
    if (t >= a) shown++;
    s.style.opacity = p;
    s.style.transform = `translateY(${(1 - outCubic(p)) * 14}px)`;
    s.style.filter = p < 1 ? `blur(${(1 - p) * 6}px)` : 'none';
    s.style.color = t < a + .55 ? '#8e8e8e' : '#ffffff';
  });
  cur.style.opacity = t > W1 + .4 ? (Math.floor(t * 2.5) % 2 ? 0 : 1) : 1;
  hint.style.opacity = prog(t, 2.7, 3.0);
  const targetH = tr.offsetHeight + 76;
  panelH += (Math.max(130, targetH) - panelH) * (1 - Math.exp(-14 / 60));
  const collapse = prog(t, 7.15, 7.6);
  const cs = spring(collapse, 1.2, 5);
  const finalW = lerp(PW, 380, cs), finalH = lerp(panelH, 96, cs);
  const pw = lerp(76, finalW, gx), ph = lerp(76, finalH, gy);
  const ptop = lerp(ORB_Y - 38, ORB_Y + 30, gy);
  const shrinkAway = inOut(prog(t, 7.95, 8.35));
  const pcy = ptop + ph / 2;
  setRect(panel, PCX, pcy, pw * (1 - shrinkAway), ph * (1 - shrinkAway), lerp(38, 30, gy));
  panel.style.display = t < 2.0 || shrinkAway >= 1 ? 'none' : '';
  const textOut = prog(t, 7.1, 7.35);
  T(tr, PCX - (PW - 100) / 2, ptop + 38 - textOut * 20, 1);
  tr.style.filter = textOut > 0 ? `blur(${textOut * 10}px)` : 'none';
  vis(tr, prog(t, 2.6, 2.75) * (1 - textOut));

  // Chip drips off the bottom, falls, lands in the email.
  const drip = prog(t, 7.4, 7.95);
  const fall = prog(t, 7.95, 8.42);
  const panelBottom = ptop + ph;
  let ccy = lerp(pcy, panelBottom + 70, outBack(drip, 1.2));
  const caretY = 1098, caretX = 420; // first line of the email body, in world space
  ccy = lerp(ccy, caretY, inCubic(fall));
  const land = prog(t, 8.42, 8.5);
  const squash = fall > 0 ? 1 + .25 * Math.sin(Math.min(1, fall) * Math.PI) * (1 - land) : 1;
  const cw = 230 * (1 - land) / squash, chh = 66 * squash * (1 - land);
  const ccx = lerp(PCX, caretX, inOut(fall));
  setRect(chip, ccx, ccy, drip > 0 ? cw : 0, chh, 33);
  const cl = $('#chiplabel');
  T(cl, ccx - 62, ccy - 17, 1, `scale(${1 - land})`);
  vis(cl, prog(t, 7.7, 7.85) * (1 - land));

  // Window rises from below.
  const win = $('#win');
  const winIn = outExpo(prog(t, 7.55, 8.4));
  T(win, PCX - 600, 880 + lerp(260, 0, winIn), 1);
  vis(win, prog(t, 7.55, 7.75));
  $('#pasted').style.display = t >= 8.48 ? '' : 'none';
  const hlP = prog(t, 8.48, 9.2);
  $('#hl').style.opacity = t >= 8.48 ? (1 - prog(t, 8.9, 9.3)) : 0;
  $('#hl').style.clipPath = `inset(0 ${100 - outExpo(hlP * 1.6) * 100}% 0 0)`;
  $('#caret').style.opacity = Math.floor(t * 2.5) % 2 ? .15 : 1;

  // Rings: while fn is held and while talking.
  const ringOn = prog(t, .7, .9) * (1 - prog(t, 1.6, 1.9)) + prog(t, 2.7, 3.1) * (1 - prog(t, 6.9, 7.2));
  rings.forEach((r, k) => {
    const ph2 = ((t * .8) + k / rings.length) % 1;
    const rad = (t < 2 ? 130 : 50) + ph2 * (t < 2 ? 520 : 760);
    const cy = (t < 2 ? 500 : ORB_Y) + worldY;
    r.style.width = r.style.height = rad * 2 + 'px';
    r.style.left = PCX - rad + 'px'; r.style.top = cy - rad + 'px';
    r.style.opacity = (1 - ph2) * .14 * ringOn * (t < 2 ? 1 : .5 + lv);
  });
  const glow = $('#glow');
  T(glow, PCX - 450, (t < 2.3 ? lerp(500, ORB_Y, toOrb) : ORB_Y) - 450 + worldY, .6 + .5 * (press * (1 - toOrb) + lv) );
  vis(glow, (pop * .8 + lv * .6) * (1 - prog(t, 7.2, 7.8)));

  // ——— Scene 4: stats, then three words.
  const st = $('#stats');
  const stIn = prog(t, 9.55, 9.9), stOut = prog(t, 10.95, 11.25);
  vis(st, stIn > 0 ? 1 - stOut : 0);
  T(st, -300 * inCubic(stOut), 0, 1);
  vis($('#statsTitle'), stIn);
  const b1 = outExpo(prog(t, 9.7, 10.5)), b2 = outExpo(prog(t, 10.0, 10.7));
  const s1 = $('#s1'), s2 = $('#s2');
  s1.querySelector('.bar').style.width = 1180 * b1 + 'px';
  s2.querySelector('.bar').style.width = Math.max(74, 91 * b2) + 'px';
  vis(s1, prog(t, 9.65, 9.85)); vis(s2, prog(t, 9.95, 10.15));
  const v1 = s1.querySelector('.val'), v2 = s2.querySelector('.val');
  v1.textContent = (1.3 * b1).toFixed(1) + ' gb'; v1.style.left = 1180 * b1 + 30 + 'px';
  v2.textContent = (0.1 * b2).toFixed(1) + ' gb'; v2.style.left = Math.max(74, 91 * b2) + 30 + 'px';
  // "13× lighter" stamp
  const stamp = spring(prog(t, 10.45, 11.0), 1.4, 5);
  v2.innerHTML = (0.1 * b2).toFixed(1) + ' gb' + `<span style="display:inline-block;margin-left:26px;font-size:34px;letter-spacing:0;background:#f6ead4;color:#1c1612;padding:8px 18px;border-radius:30px;vertical-align:12px;transform:scale(${stamp}) rotate(${-6 * stamp}deg);opacity:${prog(t, 10.45, 10.5)}">13× lighter</span>`;

  const slams = [['#w1', 11.05], ['#w2', 11.45], ['#w3', 11.85]];
  slams.forEach(([id, a], i) => {
    const el = $(id), p = prog(t, a, a + .3);
    const out = prog(t, 12.2, 12.45);
    const y = 300 + i * 200;
    const s = lerp(1.6, 1, outExpo(p)) * (1 + out * .4);
    T(el, 0, y, s);
    el.style.filter = p < 1 || out > 0 ? `blur(${(1 - outExpo(p)) * 18 + out * 20}px)` : 'none';
    vis(el, p * (1 - out));
    el.querySelector('u').style.setProperty('--s', outExpo(prog(t, a + .12, a + .45)));
  });

  // ——— Scene 5: the teeth hop in, chatter, and wipe to the end card.
  const teeth = $('#teeth');
  const hop = prog(t, 12.3, 13.0);
  const hops = 3, hp = (hop * hops) % 1;
  const hopY = hop < 1 ? -Math.sin(hp * Math.PI) * 110 : 0;
  const tx = lerp(-460, PCX - 200, outCubic(hop));
  const chatterAmt = prog(t, 12.3, 12.4);
  const jaw = chatterAmt * 18 * (0.5 - 0.5 * Math.cos(t * 2 * Math.PI * 7.5));
  const landSq = hop >= 1 ? 1 - .12 * Math.exp(-8 * (t - 13)) * Math.cos((t - 13) * 30) : 1 + .08 * Math.sin(hp * Math.PI);
  T(teeth, tx, 380 + hopY, 1.25, `scale(${2 - landSq}, ${landSq})`);
  teeth.style.transformOrigin = '200px 370px';
  $('#tTop').setAttribute('transform', `rotate(${-jaw} 112 218)`);
  $('#tKey').setAttribute('transform', `scale(1 ${Math.cos(t * 9)})`);
  $('#tShadow').setAttribute('rx', 135 + hopY * .5);
  vis(teeth, t > 12.28 ? 1 : 0);

  const wipeP = inOut(prog(t, 13.0, 13.55));
  const wipe = $('#wipe');
  wipe.style.clipPath = `circle(${wipeP * 2300}px at ${PCX}px 560px)`;
  vis(wipe, wipeP > 0 ? 1 : 0);

  const end = $('#end');
  vis(end, t > 13.15 ? 1 : 0);
  const ic = spring(prog(t, 13.2, 14.1), 1.3, 5);
  const chomp = prog(t, 14.3, 14.6);
  const icBob = Math.sin(chomp * Math.PI * 2) * 6 * (1 - chomp);
  T($('#icon'), PCX - 180, 110 + icBob, 1, `scale(${ic}) rotate(${(1 - ic) * -25}deg)`);
  $('#icon').style.transformOrigin = '180px 180px';
  [...$('#word').children].forEach((s, i) => {
    const p = spring(prog(t, 13.5 + i * .07, 14.3 + i * .07), 1.2, 5);
    s.style.transform = `translateY(${(1 - p) * 120}px)`; s.style.opacity = prog(t, 13.5 + i * .07, 13.65 + i * .07);
  });
  T($('#word'), 0, 486, 1);
  $('#word').style.clipPath = 'inset(0 0 -40px 0)';
  T($('#tag'), 0, 700 + (1 - outExpo(prog(t, 13.8, 14.3))) * 30, 1); vis($('#tag'), prog(t, 13.8, 14.1));
  const cmd = 'brew install --cask yap';
  const typed = Math.floor(cmd.length * prog(t, 14.05, 14.6));
  const brew = $('#brew');
  brew.innerHTML = `<span class="p">$</span> ${cmd.slice(0, typed)}<span style="opacity:${Math.floor(t * 3) % 2 ? 0 : 1}">▍</span>`;
  T(brew, PCX - brew.offsetWidth / 2, 800 + (1 - outExpo(prog(t, 13.95, 14.4))) * 30, 1);
  vis(brew, prog(t, 13.95, 14.2));
  $('#grain').style.opacity = t > 13.3 ? .1 : .22;
}
window.render = render;
if (!navigator.webdriver) { const t0 = performance.now(); let f = 0; const loop = () => { const t = ((performance.now() - t0) / 1000) % 15; render(t, f++); requestAnimationFrame(loop); }; loop(); }
</script>
